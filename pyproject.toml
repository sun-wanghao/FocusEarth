[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "focusearth"
version = "0.2.0"
description = "FocusEarth MME-RealWorld-RS inference and evaluation"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.3.2",
  "Pillow==11.3.0",
  "PyYAML==6.0.2",
  "torch==2.8.0",
  "transformers==4.57.6",
  "accelerate==1.12.0",
  "open_clip_torch==3.3.0",
  "spacy==3.8.16",
]

[tool.setuptools.packages.find]
include = ["focusearth*"]

